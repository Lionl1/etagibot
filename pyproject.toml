[project]
name = "etagi-realty-bot"
version = "0.1.0"
description = "Telegram bot that searches etagi.com listings with filters from a Web App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28.2",
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.14.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
